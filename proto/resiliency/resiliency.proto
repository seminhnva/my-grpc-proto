syntax = "proto3";

package resiliency;

option go_package = "github.com/seminhnva/my-grpc-proto/protogen/go/resiliency";

message ResiliencyRequest{
  int32           min_delay_second = 1 [json_name ="min_delay_second"];
  int32           max_delay_second = 2 [json_name ="max_delay_second"];
  repeated uint32 status_codes     = 3 [json_name ="status_codes"];
}

message ResiliencyResponse {
  string dummy_string = 1 [json_name="dummy_string"];
}

service ResilienceService{
  rpc UnaryResiliency(ResiliencyRequest) 
  returns( ResiliencyResponse);

  rpc ServerStreamResiliency(ResiliencyRequest) 
  returns( stream ResiliencyResponse);

  rpc ClientStreamResiliency(stream ResiliencyRequest) 
  returns( ResiliencyResponse);

  rpc BiDirectionResiliency(stream ResiliencyRequest) 
  returns( stream ResiliencyResponse);
}
service ResilienceWithMetadataService{
  rpc UnaryResiliencyWithMetadata(ResiliencyRequest) 
  returns( ResiliencyResponse);

  rpc ServerStreamResiliencyWithMetadata(ResiliencyRequest) 
  returns( stream ResiliencyResponse);

  rpc ClientStreamResiliencyWithMetadata(stream ResiliencyRequest) 
  returns( ResiliencyResponse);

  rpc BiDirectionResiliencyWithMetadata(stream ResiliencyRequest) 
  returns( stream ResiliencyResponse);
}